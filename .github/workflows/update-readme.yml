
name: Update README and Generate PDF

on:
  push:
    paths:
      - 'Crop_Yield_Prediction/Results/**'
      - 'Pest_Classification/Results/**'
      - '.github/workflows/update-readme.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate separate README galleries
        run: |
          python <<'PY'
          from pathlib import Path
          from urllib.parse import quote
          import re

          root = Path.cwd()
          readme = root / "README.md"

          projects = [
              {
                  "directory": "Crop_Yield_Prediction/Results",
                  "start": "<!-- BEGIN CROP YIELD GALLERY -->",
                  "end": "<!-- END CROP YIELD GALLERY -->",
              },
              {
                  "directory": "Pest_Classification/Results",
                  "start": "<!-- BEGIN PEST CLASSIFICATION GALLERY -->",
                  "end": "<!-- END PEST CLASSIFICATION GALLERY -->",
              },
          ]

          content = readme.read_text(encoding="utf-8")

          for project in projects:
              directory = root / project["directory"]

              images = sorted(
                  p for p in directory.rglob("*")
                  if p.is_file() and p.suffix.lower() == ".png"
              ) if directory.exists() else []

              gallery = []

              for image in images:
                  relative = image.relative_to(root).as_posix()
                  image_url = quote(relative, safe="/")
                  title = image.stem

                  gallery.append(
                      f"### {title}\n\n"
                      f"![{title}]({image_url})\n"
                  )

              generated = (
                  "\n".join(gallery)
                  if gallery
                  else "*No PNG images found.*"
              )

              pattern = (
                  re.escape(project["start"])
                  + r".*?"
                  + re.escape(project["end"])
              )

              replacement = (
                  project["start"]
                  + "\n\n"
                  + generated
                  + "\n\n"
                  + project["end"]
              )

              content, count = re.subn(
                  pattern,
                  lambda _: replacement,
                  content,
                  count=1,
                  flags=re.DOTALL,
              )

              if count != 1:
                  raise RuntimeError(
                      f"Missing markers for {project['directory']}"
                  )

          readme.write_text(content, encoding="utf-8")
          print("Both galleries generated successfully.")
          PY

      - name: Commit updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if ! git diff --cached --quiet; then
            git commit -m "Update README result galleries"
            git push
          fi

      - name: Generate README PDF
        run: |
          npx --yes md-to-pdf@5.2.5 README.md \
            --document-title "Internship Projects - IIEST Shibpur" \
            --pdf-options '{"format":"A4","margin":"15mm","printBackground":true,"preferCSSPageSize":true}' \
            --launch-options '{"args":["--no-sandbox","--disable-setuid-sandbox"]}'

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: README-PDF
          path: README.pdf
          if-no-files-found: error
          retention-days: 30
